plugins {
    id 'com.android.application'
}

def versionProperties = new Properties()
def versionPropertiesFile = rootProject.file('version.properties')
versionPropertiesFile.withInputStream {
    versionProperties.load(it)
}

android {
    namespace 'com.ajinkyadube.voicedeck'
    compileSdk 35

    defaultConfig {
        applicationId 'com.voicedeck.app'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode versionProperties.getProperty('VERSION_CODE').toInteger()
        versionName versionProperties.getProperty('VERSION_NAME')
        // Room exports versioned schemas here. Generated schema JSON must be committed.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'

    // Room 2.x supports this Java-only project through javac annotation processing.
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    // Local JVM tests for contact matching; no runtime app dependency.
    testImplementation 'junit:junit:4.13.2'

    // Instrumented Room database / DAO tests.
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}

// Manrope is fetched once and packaged in the APK for fully offline runtime use.
// Source: https://github.com/google/fonts/tree/main/ofl/manrope (OFL licensed).
def manropeFontFile = file('src/main/res/font/manrope.ttf')
tasks.register('installManropeFont') {
    outputs.file(manropeFontFile)
    doLast {
        if (!manropeFontFile.exists() || manropeFontFile.length() < 10000) {
            manropeFontFile.parentFile.mkdirs()
            def url = new URL('https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf')
            def connection = url.openConnection()
            connection.setConnectTimeout(20000)
            connection.setReadTimeout(30000)
            def temp = file(manropeFontFile.path + '.download')
            try {
                connection.getInputStream().withCloseable { input ->
                    temp.withOutputStream { output -> output << input }
                }
                if (temp.length() < 10000) throw new GradleException('Downloaded Manrope font is invalid')
                if (!temp.renameTo(manropeFontFile)) throw new GradleException('Unable to install Manrope font file')
            } finally {
                temp.delete()
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('installManropeFont') }
